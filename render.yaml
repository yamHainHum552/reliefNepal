services:
  - type: web
    name: relief-nepal-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: cd ../.. && npm install --workspaces --production=false --ignore-scripts
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://reliefnepal.org.np,https://www.reliefnepal.org.np
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    healthCheckPath: /api/v1/health